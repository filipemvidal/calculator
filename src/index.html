<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="display"></div>
        <div class="buttons">
            <div class="btn-line btn-header">
                <button class="btn-especial">C</button>
                <button class="btn-especial">CE</button>
            </div>
            <div class="btn-line">
                <button class="btn-number">7</button>
                <button class="btn-number">8</button>
                <button class="btn-number">9</button>
                <button class="btn-operation">/</button>
            </div>
            <div class="btn-line">
                <button class="btn-number">4</button>
                <button class="btn-number">5</button>
                <button class="btn-number">6</button>
                <button class="btn-operation">X</button>
            </div>
            <div class="btn-line">
                <button class="btn-number">1</button>
                <button class="btn-number">2</button>
                <button class="btn-number">3</button>
                <button class="btn-operation">-</button>
            </div>
            <div class="btn-line">
                <button class="btn-number">0</button>
                <button class="btn-number">.</button>
                <button class="btn-especial" id="equal">=</button>
                <button class="btn-operation" id="plus">+</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
